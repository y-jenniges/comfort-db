name: Tests

on:
  # Execute on push and pull-request to main
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Run full test suite
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

  fast-tests:
    # Test core package install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with only core + test extras
        run: pip install -e ".[test]"

      - name: Run unit tests
        run: pytest

  docs:
    # Build Sphinx documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with all extras
        run: pip install -e ".[all]"

      - name: Build Sphinx docs
        run: sphinx-build -W -b html documentation/source documentation/build/html

  build:
    # Build sdist and wheel, check the metadata and import the installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Install the wheel and import it
        run: |
          pip install dist/*.whl
          python -c "import comfort; print(comfort.__version__)"
